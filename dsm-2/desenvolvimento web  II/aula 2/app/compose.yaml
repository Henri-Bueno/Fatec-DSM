services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  server:
    build: ./server
    ports:
      - "${API_PORT:?Defina API_PORT no .env}:${PORT:?Defina PORT no .env}"
    environment:
      PORT: ${PORT:?Defina PORT no .env}
      PGHOST: ${PGHOST:?Defina PGHOST no .env}
      PGPORT: ${PGPORT:?Defina PGPORT no .env}
      PGDATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      PGUSER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: